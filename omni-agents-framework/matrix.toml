# Matrice de routage OmniBrain — source de vérité déclarative.
# Modifier ce fichier suffit pour ajouter/retirer un agent du réseau :
# le CLI (`omnibrain validate`, `route`, `plan`) lit cette matrice au runtime.

version = "1.0.0"

[classification]
# Scores en deçà/au-delà desquels la complexité bascule.
simple_threshold = 3
medium_threshold = 6
complex_threshold = 9
min_squad = 4
max_squad = 8
# Domaines à risque : toute occurrence fait grimper la complexité et rend
# l'expertise correspondante obligatoire dans l'escouade.
risk_domains = ["security", "finance-ohada", "devops"]
# Connecteurs détectant une demande multi-partites.
connectors = [" et ", " and ", " ainsi que ", " puis ", " ensuite ", ","]
complexity_lexemes = [
  "refonte", "migration", "architecture", "audit complet", "multi-agent",
  "multi-agents", "parallèle", "parallel", "escouade", "squad",
  "bout en bout", "end-to-end", "mise en production", "industrialisation",
]

# ---------------------------------------------------------------- agents ----

[[agents]]
id = "omnibrain"
name = "OmniBrain Orchestrator"
file = "specialized/specialized-omnibrain-orchestrator-agent.md"
orchestrator = true
domains = ["orchestration"]
keywords = ["omnibrain", "orchestration", "routage", "dispatching", "coordination"]
artifacts = ["orchestration-report"]
emoji = "🧠"

[[agents]]
id = "frontend-ui"
name = "Frontend & UI Agent"
