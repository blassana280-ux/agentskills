# ------------------------------------------------------------- contracts ----
# Contrats d'interface entre agents : le dispatcher n'émet que les contrats
# dont les membres font partie de l'escouade retenue.

[[contracts]]
artifact = "api-contract"
producers = ["backend-api"]
consumers = ["frontend-ui", "qa-test", "security"]
schema = "templates/interface-contract.md#api-contract"

[[contracts]]
artifact = "data-contract"
producers = ["data-ai"]
consumers = ["backend-api", "product-delivery", "qa-test"]
schema = "templates/interface-contract.md#data-contract"

[[contracts]]
artifact = "test-plan"
producers = ["qa-test"]
consumers = ["backend-api", "frontend-ui", "devops-sre"]
schema = "templates/interface-contract.md#test-plan"

[[contracts]]
artifact = "deployment-plan"
producers = ["devops-sre"]
consumers = ["security", "qa-test", "backend-api"]
schema = "templates/interface-contract.md#deployment-plan"

[[contracts]]
artifact = "ui-components"
producers = ["frontend-ui"]
consumers = ["product-delivery", "qa-test"]
schema = "templates/interface-contract.md#ui-contract"

[[contracts]]
artifact = "security-findings"
producers = ["security"]
consumers = ["backend-api", "devops-sre", "adversarial-reviewer"]
schema = "templates/interface-contract.md#security-contract"

[[contracts]]
artifact = "research-dossier"
producers = ["research-intel"]
consumers = ["product-delivery", "marketing-growth", "ohada-finance"]
schema = "templates/interface-contract.md#research-contract"
