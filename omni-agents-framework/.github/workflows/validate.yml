name: OmniBrain CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate agent network
        run: python3 -m omnibrain validate
      - name: Run test suite
        run: python3 -m unittest discover -s tests -v
      - name: Smoke-test CLI on all examples
        run: |
          for f in examples/task-*.md; do
            python3 -m omnibrain plan "$f" --format json > /tmp/plan.json
            python3 -c "import json,sys; d=json.load(open('/tmp/plan.json')); assert d['briefs'] and d['wave']==0"
          done
      - name: Parallel execution covers all 12 agents
        run: python3 scripts/demo-parallele.py
